name: Generate signing keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  keystore:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Generate a new release keystore
        run: |
          umask 077
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias bbox-next \
            -keyalg RSA -keysize 4096 -validity 10950 \
            -storepass "$KEYSTORE_PASS" -keypass "$KEYSTORE_PASS" \
            -dname 'CN=B-box Next, OU=B-box Next, O=B-box Next, L=Internet, ST=Internet, C=CN'
          printf 'KEYSTORE_BASE64=%s\n' "$(base64 -w0 release.keystore)" > keystore.env
          printf 'KEYSTORE_PASS=%s\n' "$KEYSTORE_PASS" >> keystore.env
          printf 'ALIAS_NAME=bbox-next\n' >> keystore.env
          printf 'ALIAS_PASS=%s\n' "$KEYSTORE_PASS" >> keystore.env
      - name: Write keystore values to the job summary
        run: |
          {
            echo '### Keystore secrets (copy each value into repository secrets, then delete this run)'
            echo
            echo 'Secrets to configure: KEYSTORE_BASE64, KEYSTORE_PASS, ALIAS_NAME, ALIAS_PASS.'
            echo
            echo '```'
            cat keystore.env
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          KEYSTORE_PASS: bbox-next-$(date +%s)
